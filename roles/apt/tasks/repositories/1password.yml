# The 1password package writes /etc/apt/sources.list.d/1password.sources itself
# and rewrites it on every upgrade. The source is only added under that name
# while it is missing, so the package takes it over on install and later runs
# leave it alone. If only 1password-cli is installed, this source stays.
- name: Check for the 1Password apt repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/1password.sources
  register: apt_onepassword_source

- name: Add the 1Password apt repository
  ansible.builtin.deb822_repository:
    name: 1password
    uris: "https://downloads.1password.com/linux/debian/{{ apt_arch }}"
    suites: stable
    components: main
    architectures: "{{ apt_arch }}"
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
  become: true
  when: not apt_onepassword_source.stat.exists
