argument_specs:
  main:
    short_description: Add third-party apt repositories and install packages.
    description:
      - Adds the repositories first, then installs all packages in one transaction.
      - >-
        Repositories and packages are independent. A package from a third-party
        repository only installs if that repository is listed too.
    options:
      apt_repositories:
        type: list
        elements: str
        default: []
        choices:
          - 1password
          - docker
          - github-cli
          - vivaldi
        description: >-
          Third-party repositories to add. Each name is a task file in
          C(tasks/repositories/).
      apt_packages:
        type: list
        elements: str
        default: []
        description: Packages to install, from Debian or any added repository.
      apt_unattended_upgrades:
        type: bool
        default: true
        description: >-
          Let unattended-upgrades upgrade the repositories in C(apt_repositories),
          through a file C(/etc/apt/apt.conf.d/53-unattended-upgrades-<repo>) each.
          Ubuntu runs unattended-upgrades by default, so this applies even
          without the upgrades role. False removes those files again. Applies
          only to the repositories of this role call.
