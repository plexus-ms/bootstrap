- name: Install Docker Engine
  ansible.builtin.include_role:
    name: plexus.bootstrap.apt
  vars:
    apt_repositories:
      - docker
    apt_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    # An upgrade restarts the daemon, which stops containers without a
    # restart policy.
    apt_unattended_upgrades: "{{ docker_unattended_upgrades }}"

- name: Add {{ docker_user }} to the docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  become: true
