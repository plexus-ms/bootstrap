argument_specs:
  main:
    short_description: Install Docker Engine and let a user run docker without sudo.
    description:
      - Adds Docker's apt repository and installs Docker Engine through the apt role.
    options:
      docker_user:
        type: str
        description: >-
          User added to the docker group. Defaults to the user running the
          play. Takes effect at next login.
      docker_unattended_upgrades:
        type: bool
        default: true
        description: >-
          Let unattended-upgrades upgrade Docker Engine. An upgrade restarts the
          daemon, which stops containers that have no restart policy.
